# 知债：星穹学途 · 持续集成
# ============================================================
# 目标：任何 push / PR 自动执行「构建 → 测试 → 比对 → 语法检查」，
#       main 分支全绿才可合并，杜绝「静默漂移」（P2/P3 的根因缓解）。
# 不变量：golden 契约 17 份全绿、verify_all.ps1 退出码 0、既有测试零回归。
#
# 运行环境选 windows-latest：verify_all.ps1 依赖 PowerShell（同步脚本与编码处理），
# 与本地开发机保持一致，避免 Linux 上出现「本地绿、CI 红」的伪失败。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上的并发运行自动取消，节省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: build · test · verify
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      # Windows runner 控制台默认 cp1252：python 校验脚本输出中文与 open() 默认编码
      # 都会 UnicodeEncodeError/DecodeError（T20/T21 首跑 CI 红根因之一），强制 UTF-8。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          # NuGet 缓存：cache 只接受布尔值（写 nuget 会报 YAML schema 错）；
          # 缓存键取全部 csproj 哈希（仓库无 packages.lock.json）
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不开 pip 缓存：requirements.txt 里没有任何依赖（门禁脚本全用标准库），
          # 缓存目录不会生成，收尾保存缓存时反而报错把整个作业判失败。
          # 将来真引入依赖了，再加回 cache: pip 并补一个 pip install 步骤。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # ① 全解决方案构建（Release）
      - name: dotnet build
        run: dotnet build AstralPath.slnx -c Release

      # ② 测试（5 个项目；Mobile.Offline 的图谱/OCR 回归由 verify_all 覆盖）
      - name: dotnet test
        run: |
          dotnet test tests/AstralPath.Core.Tests -c Release --no-build
          dotnet test tests/AstralPath.Persistence.Tests -c Release --no-build
          dotnet test tests/AstralPath.Desktop.Tests -c Release --no-build
          dotnet test tests/AstralPath.Api.Tests -c Release --no-build
          dotnet test tests/AstralPath.Eval.Tests -c Release --no-build

      # ③ 常量对齐：JS 的 K ↔ C# 的 FormulaConstants
      - name: verify constants
        run: python scripts/verify_constants.py

      # ③b 公式常量生成区：K 由 C# 源生成，禁止两侧手工同步（P2-10）
      - name: verify formula constants generated
        run: python scripts/gen_formula_constants.py --check

      # ④ 意图表五方比对（json / 主 HTML / C# 登记表 / C# 运行时词表 / p2 副本）
      - name: verify agent intents
        run: python scripts/verify_agent_intents.py

      # ⑤ 公式跨语言比对
      - name: verify formulas
        run: python scripts/verify_formulas.py

      # ⑥ 前端 JS 语法门禁（独立脚本 + HTML 内联块，只解析不执行）
      - name: check-js
        run: node tools/check-js.js

      # XSS 用例（模型输出/用户内容进 DOM 前的白名单渲染）
      - name: verify xss cases
        run: python scripts/verify_xss.py

      # ⑧ 共享内核：常量块与 JSON 一致 + 与旧实现行为等价双跑
      - name: verify shared core
        run: |
          node scripts/gen-shared-core.js --check
          python scripts/verify_core.py

      # 前端构建合并：index.html 的 AP 生成区与 shared/ 逐字一致
      - name: verify frontend regions
        run: python scripts/gen_frontend_regions.py --check

      # state 分片存储：用例 10 例 + 页面接入校验
      - name: verify store shards
        run: python scripts/verify_store.py

      # ⑧d 图谱质量门禁（P1-7）：退化标题 / 空标题 / 父子同名 / 节点规模 / md 一致性
      - name: verify graph quality
        run: |
          python scripts/verify_graph_quality.py --check
          python scripts/repair_kg_titles.py --check

      # ⑧d-2 图谱性能预算（P2-10）：确定性语料跑分章→构图，量级退化即红
      - name: verify kg performance
        run: python scripts/bench_kg.py --check

      # 试卷结构化用例 + 单文件内联 JS 行数上限
      - name: verify exam golden
        run: node scripts/exam_runner.js

      - name: verify kg-text golden
        run: node scripts/kg_text_runner.js

      - name: verify agent-router golden
        run: node scripts/agent_router_runner.js

      - name: verify plan-scheduler golden
        run: node scripts/plan_scheduler_runner.js

      - name: verify inline js budget
        run: python scripts/verify_inline_js.py --check

      # ⑨ 空 catch 门禁：每个 catch 必须有记录或降级动作
      - name: verify no empty catch
        run: python scripts/verify_no_empty_catch.py

      # ⑧ 命名规范扫描（旧名残留；脚本内置「政策声明语境」判定）
      - name: naming consistency
        run: python scripts/naming_consistency.py --check

      # ⑧f 代码风格门禁（P2-10）：C# dotnet format + 前端 eslint
      - name: dotnet format
        run: dotnet format whitespace AstralPath.slnx --verify-no-changes --no-restore

      - name: eslint
        run: npx --no-install eslint .

      # ⑨ 一键验收全家桶（三端 HTML 同源 + C3 XSS 回归哨兵 + 剩余测试）
      - name: verify_all
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify_all.ps1

  # 覆盖率硬门禁（P2-10）：低于行/分支阈值即判红，不再 report-only
  coverage:
    name: coverage gate
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_UI_LANGUAGE: en
      # 与 gate 作业一致：Windows 控制台 cp1252，脚本输出中文会崩
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: collect coverage
        run: >
          dotnet test tests/AstralPath.Core.Tests
          -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/coverage

      - name: verify coverage threshold
        run: python scripts/verify_coverage.py --check

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./artifacts/coverage
          if-no-files-found: warn

  # 发布管线零验证的补救：CI 里真跑一次 Android 打包（用 runner 上现生成的临时
  # 密钥，不接触仓库外的签名环境），失败即阻断，保证发得出去的包首先构建得出来。
  android:
    name: android build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      # 临时签名密钥：口令只在 runner 内有效，产出未签名/临时签名 APK，仅验证构建链路
      - name: 生成临时签名密钥
        shell: pwsh
        run: |
          $ks = Join-Path $env:RUNNER_TEMP "ci-release.keystore"
          # PKCS12 的 key 口令与 store 口令必须一致（-keypass 会被忽略），
          # 所以这里两个都用 ci-store-pass，Gradle 侧的 KEY_PASSWORD 也传这个
          keytool -genkeypair -v -keystore $ks -storetype PKCS12 `
            -alias astralpath -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass ci-store-pass `
            -dname "CN=CI, OU=CI, O=AstralPath, L=CI, S=CI, C=CN" | Out-Null
          "ASTRALPATH_KEYSTORE=$ks" | Out-File -Append $env:GITHUB_ENV
          "ASTRALPATH_STORE_PASSWORD=ci-store-pass" | Out-File -Append $env:GITHUB_ENV
          "ASTRALPATH_KEY_ALIAS=astralpath" | Out-File -Append $env:GITHUB_ENV
          "ASTRALPATH_KEY_PASSWORD=ci-store-pass" | Out-File -Append $env:GITHUB_ENV

      - name: gradle assembleRelease
        shell: pwsh
        run: |
          Push-Location src/AstralPath.Native
          try { gradle assembleRelease --console=plain } finally { Pop-Location }

      - name: 校验 APK 产物
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter "*.apk" src/AstralPath.Native/app/build/outputs/apk |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { throw "未找到 APK 产物" }
          $size = [math]::Round($apk.Length / 1MB, 1)
          Write-Host "APK: $($apk.FullName) ($size MB)"
          # 调用运算符不展开通配符，先把 aapt2 解析成实际路径
          $aapt2 = Get-ChildItem (Join-Path $env:ANDROID_HOME "build-tools\*\aapt2.exe") |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $aapt2) { throw "未找到 aapt2.exe" }
          & $aapt2.FullName dump badging $apk.FullName |
            Select-String "package: name=|versionName" | ForEach-Object { Write-Host $_ }

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-apk
          path: src/AstralPath.Native/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # 浏览器冒烟：三条主流程（教材解析 / 练习出题 / 修复计划）+ 零运行期错误。
  # 外部网络在用例内被阻断，AI 入口走本地规则兜底，不依赖模型可用性。
  playwright:
    name: browser smoke
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install chromium

      - name: 运行冒烟
        run: npx playwright test --reporter=list
